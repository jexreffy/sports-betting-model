<dialog id="ticket-modal" class="ticket-modal">
  <form id="ticket-modal-form" class="ticket-form" method="dialog">
    <h2>Log a ticket</h2>
    <label>Sportsbook <input name="sportsbook" value="Novig" /></label>
    <label>Stake $ <input name="stake_dollars" type="number" step="0.01" required /></label>
    <label>American odds <input name="american_odds" type="number" placeholder="-110" /></label>
    <label>Implied (0-1) <input name="implied_prob" type="number" step="0.001" min="0" max="1" /></label>
    <label>Kind
      <select name="kind">
        <option value="straight">straight</option>
        <option value="parlay">parlay</option>
      </select>
    </label>
    <label>League
      <select name="league">
        <option value="nfl">nfl</option>
        <option value="cfb">cfb</option>
      </select>
    </label>
    <label>Season <input name="season" type="number" value="{{ season }}" /></label>
    <label>Week <input name="week" type="number" value="1" /></label>
    <label>Team / side <input name="team_or_side" required placeholder="BUF" /></label>
    <label>Opponent <input name="opponent" placeholder="DET" /></label>
    <label>Market
      <select name="market">
        <option value="moneyline">moneyline</option>
        <option value="spread">spread</option>
        <option value="total">total</option>
        <option value="">prop / other</option>
      </select>
    </label>
    <label>Side
      <select name="side">
        <option value="away">away</option>
        <option value="home">home</option>
        <option value="over">over</option>
        <option value="under">under</option>
        <option value="">prop / other</option>
      </select>
    </label>
    <label>Line (your slip) <input name="market_line" type="number" step="0.5" /></label>
    <label>Game id <input name="game_id" placeholder="optional" /></label>
    <label class="span-2">Notes <input name="notes" /></label>
    <div class="modal-actions span-2">
      <button type="submit">Add ticket</button>
      <button type="button" id="ticket-modal-cancel">Cancel</button>
    </div>
    <p class="muted span-2">Parlays: extra legs via <code>sbm journal add --extra-leg</code> or POST JSON.</p>
  </form>
</dialog>
<script src="/static/ticket-modal.js"></script>
