<div class="chores" aria-label="Weekly updates">
  <button type="button" class="chore" data-chore="refresh" data-url="/api/ingest" title="Download 2026 finals and closing lines. Other seasons stay put.">Refresh scores</button>
  <button type="button" class="chore" data-chore="settle" data-url="/api/journal/settle" title="Grade open 2026 tickets whose games are final. Does not add tickets.">Settle journal</button>
  <span class="chore-status" role="status"></span>
</div>
<script src="/static/chores.js"></script>
